name: Frontend checks

on:
  pull_request:
    branches: [main, pr08-security-hardening]
  push:
    branches: [main, pr05-role-aware-ux, pr08-security-hardening, pr09-devsecops]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: PR05 role-aware UX regression
        run: node test_pr05.mjs
      - name: PR08 frontend security regression
        run: node test_pr08.mjs
      - name: Build
        run: npm run build
