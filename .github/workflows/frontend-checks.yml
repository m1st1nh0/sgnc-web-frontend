name: Frontend checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: PR05 role-aware UX regression
        run: node test_pr05.mjs
      - name: PR08 frontend security regression
        run: node test_pr08.mjs
      - name: PR06 Insights V2 presentation regression
        run: node test_pr06.mjs
      - name: PR07 report UI regression
        run: node test_pr07.mjs
      - name: UX operation and KPI explanation regression
        run: node test_ux_operacao_indicadores.mjs
      - name: PR09 hybrid onboarding regression
        run: node test_pr09_onboarding.mjs
      - name: Playwright browser setup
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Unit and HTTP security tests
        run: npx playwright test --project=unit --project=http
      - name: Desktop and mobile smoke tests
        run: npm run test:e2e
