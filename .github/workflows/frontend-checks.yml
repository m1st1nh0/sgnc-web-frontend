name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pr05-role-aware-ux, pr06-insights-visual-v2]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: PR05 role-aware UX regression
        run: node test_pr05.mjs
      - name: PR06 Insights V2 presentation regression
        run: node test_pr06.mjs
      - name: Build
        run: npm run build
